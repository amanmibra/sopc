# Behavior gate: run YOUR agent tests for the agents a pull request changes.
#
# Copy to .github/workflows/ in your repo, then fill in the "Run your tests" step.
#
#   job `detect`  `sopc affected` works out which agents to test:
#                   - the agents whose built prompt changed in this PR
#                   - or, if none changed (e.g. only test files changed) or the run was started
#                     by hand with no agents given: every agent
#   job `test`    runs your command once, with the agent ids in environment variables
#   job `test-each` (optional, commented out) runs your command once per agent, in parallel
#
# Make the `behavior-gate / test` check required in your branch protection rules to block
# merges when your tests fail.

name: behavior-gate

on:
  pull_request:
    paths:
      - "sops/**"     # your sopc root
      - "tests/**"    # your agent tests (changes here run every agent)
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents to test: sopc ids or platform ids, space-separated (blank = all)"
        required: false
        default: ""

env:
  SOPC_ROOT: "" # your sopc folder; blank = sops/ (or the repo root if sopc.yaml is there)
  SOPC_VERSION: v0.0.13 # a sopc release tag

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.agents.outputs.ids }}                    # sopc ids: "tonys-pizza sakura-sushi"
      platform_ids: ${{ steps.agents.outputs.platform_ids }}  # the platform's own ids: "tonys-pizza asst_9f3e"
      matrix: ${{ steps.agents.outputs.matrix }}              # JSON list, one object per agent (see README)
      count: ${{ steps.agents.outputs.count }}
      all: ${{ steps.agents.outputs.all }}                    # "true" when testing every agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch is needed to see what changed

      - name: Install sopc
        run: |
          curl -fsSL https://raw.githubusercontent.com/amanmibra/sopc/main/install.sh | SOPC_REF="$SOPC_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail first on duplicated or conflicting instructions. Delete this step to allow them.
      - name: Lint
        run: sopc lint ${SOPC_ROOT:+--dir "$SOPC_ROOT"} --strict

      - name: Work out which agents to test
        id: agents
        env:
          # A PR: compare with its base branch. By hand: compare with HEAD itself, so nothing
          # changed and --all-if-none tests every agent (unless agents were given).
          AGAINST: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD' }}
          REQUESTED: ${{ inputs.agents }}
        run: sopc affected ${SOPC_ROOT:+--dir "$SOPC_ROOT"} --against "$AGAINST" --agents "$REQUESTED" --all-if-none --ci

  test:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      AGENT_IDS: ${{ needs.detect.outputs.ids }}                   # sopc ids (file names in agents/)
      AGENT_PLATFORM_IDS: ${{ needs.detect.outputs.platform_ids }} # LiveKit agent_name, Vapi assistant id, ...
      AGENTS_JSON: ${{ needs.detect.outputs.matrix }}              # per agent: ids, platform, changed SOPs, all SOPs
      ALL_AGENTS: ${{ needs.detect.outputs.all }}                  # "true" if testing every agent
    steps:
      - uses: actions/checkout@v4

      # Set up whatever your tests need (Node, Python, secrets, ...), e.g.:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: npm ci

      - name: Run your tests
        run: |
          echo "Testing: $AGENT_IDS (all agents: $ALL_AGENTS)"
          # ↓ Replace with your command. Examples:
          #   npm run test:agents -- --agents "$AGENT_IDS"
          #   pytest tests/agents -k "$(echo $AGENT_IDS | sed 's/ / or /g')"
          #   for id in $AGENT_PLATFORM_IDS; do ./scripts/simulate.sh "$id"; done
          #   echo "$AGENTS_JSON" | jq -r '.[] | "\(.id) \(.changed_sops | join(","))"'   # only the SOPs that changed
          echo "No test command configured yet" && exit 1

  # Optional: one job per agent, in parallel. Each sees its own agent in matrix.agent.
  # test-each:
  #   needs: detect
  #   if: needs.detect.outputs.count != '0'
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       agent: ${{ fromJSON(needs.detect.outputs.matrix) }}
  #   name: test ${{ matrix.agent.id }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: ./scripts/test-agent.sh "${{ matrix.agent.platform_id }}" "${{ join(matrix.agent.changed_sops, ',') }}"
